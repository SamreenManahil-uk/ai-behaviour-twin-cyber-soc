name: Cyber SOC Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyber-soc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ASP.NET Core
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_CLI_HOME: ${{ runner.temp }}/dotnet
      NUGET_PACKAGES: ${{ runner.temp }}/nuget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore backend/CyberSoc.sln

      - name: Build with warnings as errors
        run: >
          dotnet build backend/CyberSoc.sln
          --configuration Release
          --no-restore
          -p:TreatWarningsAsErrors=true

      - name: Run complete backend tests
        run: >
          dotnet test backend/CyberSoc.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "console;verbosity=normal"

      - name: Verify .NET formatting
        run: >
          dotnet format backend/CyberSoc.sln
          --verify-no-changes
          --no-restore

  ml-service:
    name: Python ML Service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ml-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml-service/requirements.txt
            ml-service/requirements-dev.txt

      - name: Install Linux OpenMP runtime
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            libgomp1

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement requirements-dev.txt

      - name: Validate Python dependency environment
        run: python -m pip check

      - name: Run Ruff
        run: >
          python -m ruff check
          src
          scripts
          tests

      - name: Run complete synthetic Python tests
        run: |
          mkdir -p .cache/pytest
          python -m pytest tests -q \
            -o cache_dir=.pytest_cache \
            --basetemp=.cache/pytest

  frontend:
    name: React Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend tests
        run: npm run test

      - name: Run frontend lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build
