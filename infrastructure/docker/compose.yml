name: cyber-soc

services:
  postgres:
    image: postgres:18.6-trixie
    container_name: cyber-soc-postgres
    environment:
      POSTGRES_DB: cyber_soc
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in .env}
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: initialize_app_role
        target: /docker-entrypoint-initdb.d/01-app-role.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$APP_DB_USER\" -d cyber_soc"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: cyber-soc-postgres-data

configs:
  initialize_app_role:
    content: |
      #!/bin/sh
      set -eu
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname cyber_soc <<'SQL'
      \getenv app_user APP_DB_USER
      \getenv app_password APP_DB_PASSWORD
      CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_password';
      ALTER DATABASE cyber_soc OWNER TO :"app_user";
      REVOKE ALL ON DATABASE cyber_soc FROM PUBLIC;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE, CREATE ON SCHEMA public TO :"app_user";
      SQL
